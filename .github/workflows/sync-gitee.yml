name: 同步舆情数据到 Gitee

on:
  schedule:
    # 北京时间工作日 06:00
    # 对应 UTC 前一天 22:00，此时 UTC 星期为 周日(0) ~ 周四(4)
    - cron: "0 22 * * 0-4"
    # 北京时间工作日 08:06
    # 对应 UTC 当天 00:06，此时 UTC 星期为 周一(1) ~ 周五(5)
    - cron: "6 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITEE_REPO: ${{ vars.GITEE_REPO }}
      GITEE_BRANCH: ${{ vars.GITEE_BRANCH || 'master' }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      SOURCE_DIR: report-data
    steps:
      - name: 拉取同步脚本
        uses: actions/checkout@v4

      - name: 拉取 gh-pages 报告数据
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: report-data
          fetch-depth: 1

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步 JSON 到 Gitee
        run: python scripts/sync_to_gitee.py
