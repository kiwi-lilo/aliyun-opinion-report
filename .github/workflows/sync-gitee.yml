name: 同步舆情数据到 Gitee

on:
  schedule:
    # GitHub Actions 使用 UTC；以下为北京时间工作日 08:15 和 09:00。
    - cron: "15 0 * * 1-5"
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITEE_REPO: ${{ vars.GITEE_REPO }}
      GITEE_BRANCH: ${{ vars.GITEE_BRANCH || 'master' }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      SOURCE_DIR: report-data
    steps:
      - name: 拉取同步脚本
        uses: actions/checkout@v4

      - name: 拉取 gh-pages 报告数据
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: report-data
          fetch-depth: 1

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步 JSON 到 Gitee
        run: python scripts/sync_to_gitee.py
