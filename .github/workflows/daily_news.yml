name: 每日央媒早报自动抓取

# 触发条件配置
on:
  schedule:
    # 这里的 cron 是 UTC 时间。
    # UTC 0 点 = 北京时间早上 8 点
    - cron: '0 0 * * *'
  workflow_dispatch: # 这个配置的作用是，允许你在 GitHub 页面上手动点一个按钮来立即运行测试

jobs:
  run-python-script:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 云服务器

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v3

    - name: 2. 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # 这里的版本可以选 3.10 等

    - name: 3. 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 4. 运行抓取并发送邮件
      run: python main.py
