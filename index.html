<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>陕西舆情工作台</title>
  <style>
    :root {
      --bg: #edf1f2;
      --paper: #fff;
      --ink: #1d292d;
      --muted: #6d7b80;
      --line: #d8e0e1;
      --dark: #172529;
      --teal: #16766b;
      --teal-soft: #e7f3f0;
      --red: #b34b42;
      --red-soft: #faece9;
      --amber: #a66a27;
      --blue: #2d6378;
      --shadow: 0 12px 30px rgba(23, 37, 41, .07);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; color: var(--ink); background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .masthead { color: #f7fbfa; background: var(--dark); }
    .masthead-inner, main, footer { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    .masthead-inner { padding: 34px 0 0; }
    .brand-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .kicker, .section-label { margin: 0 0 8px; color: #9fb4b5; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 46px); font-weight: 700; line-height: 1.1; }
    .subline { margin: 12px 0 28px; color: #c1cecf; font-size: 13px; }
    .status { flex: none; align-self: center; display: inline-flex; align-items: center; gap: 8px; color: #c3d8d2; font-size: 12px; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #4fc39c; box-shadow: 0 0 0 4px rgba(79, 195, 156, .12); }
    .tabs { display: flex; gap: 28px; border-bottom: 1px solid rgba(255,255,255,.16); }
    .tab { position: relative; border: 0; padding: 15px 0 14px; color: #9fb4b5; background: transparent; font-weight: 700; }
    .tab[aria-selected="true"] { color: #fff; }
    .tab[aria-selected="true"]::after { content: ""; position: absolute; right: 0; bottom: -1px; left: 0; height: 3px; background: #74c7b4; }
    .tab-count { display: inline-block; min-width: 20px; margin-left: 5px; padding: 2px 5px; border-radius: 12px; color: #dceae8; background: rgba(255,255,255,.13); font-size: 11px; text-align: center; }
    main { padding: 28px 0 44px; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 28px; border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow); }
    .metric { min-height: 92px; padding: 17px 20px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-value { display: block; color: var(--dark); font-size: 28px; font-weight: 750; line-height: 1; }
    .metric-label { display: block; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .metric-action { width: 100%; border: 0; border-right: 1px solid var(--line) !important; text-align: left; background: var(--paper); }
    .metric-action:hover { background: var(--teal-soft); }
    .metric-action:focus-visible { position: relative; z-index: 1; outline: 3px solid #a9d3ca; outline-offset: -3px; }
    .candidate-panel { margin: -10px 0 28px; padding: 20px; border: 1px solid #b8d4cf; background: #f4faf8; box-shadow: var(--shadow); }
    .candidate-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 15px; margin-bottom: 13px; }
    .candidate-head h3 { margin: 0; font-size: 19px; }
    .candidate-list { display: grid; gap: 7px; max-height: 360px; overflow: auto; }
    .candidate-row { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #d6e7e3; background: #fff; }
    .candidate-row strong { color: var(--ink); font-size: 13px; line-height: 1.55; }
    .candidate-row a { color: inherit; text-decoration: none; }
    .candidate-row a:hover { color: var(--blue); text-decoration: underline; }
    .candidate-meta { color: var(--muted); font-size: 11px; }
    .select-candidate, .generate-button, .copy-draft { border: 1px solid #a5c8c1; padding: 7px 10px; border-radius: 4px; color: var(--teal); background: #fff; font-size: 12px; font-weight: 700; }
    .select-candidate:hover, .generate-button:hover, .copy-draft:hover { background: var(--teal-soft); }
    .select-candidate[data-selected="true"] { color: #fff; background: var(--teal); }
    .candidate-detail { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 16px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #cde1dc; }
    .candidate-detail p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .candidate-detail strong { color: var(--ink); font-size: 14px; }
    .draft-box { margin-top: 14px; }
    .draft-box textarea { display: block; width: 100%; min-height: 105px; resize: vertical; border: 1px solid #c6d9d5; padding: 11px; color: var(--ink); background: #fff; line-height: 1.7; outline: none; }
    .draft-box textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(22,118,107,.1); }
    .draft-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .draft-status { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 34px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 25px; line-height: 1.2; }
    .count { color: var(--muted); font-size: 12px; }
    .toolbar { display: flex; align-items: center; gap: 8px; margin: 0 0 13px; }
    .filter { border: 1px solid var(--line); padding: 6px 11px; border-radius: 4px; color: var(--muted); background: var(--paper); font-size: 12px; }
    .filter[aria-pressed="true"] { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
    .search { min-width: 150px; margin-left: auto; border: 1px solid var(--line); padding: 7px 10px; border-radius: 4px; color: var(--ink); background: var(--paper); outline: none; font-size: 12px; }
    .search:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(22,118,107,.1); }
    .issue-list { display: grid; gap: 10px; border-top: 2px solid var(--dark); padding-top: 2px; }
    .issue { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 15px; padding: 18px 19px; border: 1px solid var(--line); border-left: 4px solid var(--amber); background: var(--paper); box-shadow: 0 3px 12px rgba(23,37,41,.035); }
    .issue[data-level="negative"] { border-left-color: var(--red); }
    .issue[data-level="positive"] { border-left-color: var(--teal); }
    .issue-number { color: #9aa8aa; font-size: 16px; font-weight: 750; }
    .issue-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; }
    .issue-meta { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .issue-meta strong { color: var(--ink); font-size: 14px; }
    .tag { display: inline-block; margin-left: 7px; padding: 2px 6px; border-radius: 3px; color: var(--red); background: var(--red-soft); font-size: 11px; }
    .tag.good { color: var(--teal); background: var(--teal-soft); }
    .copy-button { flex: none; min-width: 58px; border: 1px solid #b6c1c2; padding: 7px 10px; border-radius: 4px; color: var(--dark); background: #fff; font-size: 12px; font-weight: 700; }
    .copy-button:hover { border-color: var(--teal); color: var(--teal); }
    .copy-button[data-state="copied"] { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
    .issue-summary { margin: 12px 0 10px; font-size: 15px; line-height: 1.8; overflow-wrap: anywhere; }
    .issue-link { color: var(--blue); font-size: 12px; font-weight: 700; text-decoration: none; }
    .issue-link:hover { text-decoration: underline; }
    .other-news { margin-top: 30px; border-top: 2px solid var(--dark); }
    .other-news-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding: 16px 0 10px; }
    .other-news h3 { margin: 0; font-size: 18px; }
    .other-news-list { margin: 0; padding: 0; list-style: none; }
    .other-news-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .other-news-row a { min-width: 0; color: var(--ink); font-size: 13px; line-height: 1.55; text-decoration: none; }
    .other-news-row a:hover { color: var(--blue); text-decoration: underline; }
    .other-news-row span { flex: none; color: var(--muted); font-size: 11px; }
    .aside { border-left: 1px solid var(--line); padding-left: 25px; }
    .aside-section { padding: 3px 0 22px; border-bottom: 1px solid var(--line); }
    .aside-section + .aside-section { padding-top: 22px; }
    .aside-title { margin: 0 0 13px; font-size: 18px; }
    .source-list { margin: 0; padding: 0; list-style: none; }
    .source-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #e8eded; font-size: 13px; }
    .source-row span { color: var(--muted); }
    .note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .empty { padding: 24px; border: 1px dashed #b9c8c8; color: var(--muted); background: rgba(255,255,255,.5); text-align: center; }
    footer { padding: 0 0 30px; color: var(--muted); font-size: 12px; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .masthead-inner, main, footer { width: min(100% - 24px, 1120px); }
      .masthead-inner { padding-top: 24px; }
      .brand-row { display: block; }
      .status { margin-top: 17px; }
      .tabs { gap: 20px; margin-top: 20px; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .content-grid { grid-template-columns: 1fr; gap: 28px; }
      .aside { border-top: 1px solid var(--line); border-left: 0; padding: 23px 0 0; }
    }
    @media (max-width: 480px) {
      h1 { font-size: 30px; }
      .toolbar { flex-wrap: wrap; }
      .search { width: 100%; margin-left: 0; }
      .issue { grid-template-columns: 27px minmax(0,1fr); gap: 10px; padding: 15px 12px; }
      .issue-top { display: block; }
      .copy-button { margin-top: 10px; }
      .candidate-detail { grid-template-columns: 1fr; }
      .candidate-row { grid-template-columns: 24px minmax(0,1fr); }
      .select-candidate { grid-column: 2; justify-self: start; }
      .other-news-row { display: block; }
      .other-news-row span { display: block; margin-top: 3px; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand-row">
        <div><p class="kicker">Daily intelligence / Shaanxi</p><h1>陕西舆情工作台</h1><p class="subline" id="updated-line">正在读取最新日报</p></div>
        <span class="status" id="status-line">在线读取</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="报告类型">
        <button class="tab" type="button" role="tab" aria-selected="true" data-tab="personal">个人舆情 <span class="tab-count" id="personal-count">--</span></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="media">央媒涉陕 <span class="tab-count" id="media-count">--</span></button>
      </nav>
    </div>
  </header>
  <main>
    <section class="metrics" id="metrics" aria-label="报告统计"></section>
    <section class="candidate-panel" id="candidate-panel" hidden>
      <div class="candidate-head"><div><p class="section-label">RSS discovery</p><h3>RSS 候选标题</h3><p class="note">候选来自 RSS，只有标记“已核验原文”的链接才属于已确认的央媒正文。</p></div><span class="count" id="candidate-count">--</span></div>
      <div class="candidate-list" id="candidate-list"></div>
      <div class="candidate-detail" id="candidate-detail" hidden>
        <p><strong id="selected-candidate-title">尚未选择候选</strong><br><span id="selected-candidate-meta"></span></p>
        <button class="generate-button" id="generate-button" type="button" disabled>生成摘要</button>
      </div>
      <div class="draft-box" id="draft-box" hidden>
        <textarea id="draft-text" placeholder="生成的摘要会出现在这里"></textarea>
        <div class="draft-actions"><button class="copy-draft" id="copy-draft" type="button">按格式复制</button></div>
        <p class="draft-status" id="draft-status"></p>
      </div>
    </section>
    <div class="content-grid">
      <section>
        <div class="section-head"><div><p class="section-label" id="section-label">Personal / 01</p><h2 id="panel-title">精选舆情</h2></div><span class="count" id="result-count">--</span></div>
        <div class="toolbar" id="toolbar"><button class="filter" type="button" aria-pressed="true" data-filter="all">全部</button><button class="filter" type="button" aria-pressed="false" data-filter="negative">负面</button><button class="filter" type="button" aria-pressed="false" data-filter="positive">正向</button><input class="search" id="issue-search" type="search" placeholder="搜索城市、摘要或用户" aria-label="搜索"></div>
        <div class="issue-list" id="issue-list"><div class="empty">正在读取最新数据…</div></div>
        <section class="other-news" id="other-news" hidden>
          <div class="other-news-head"><div><p class="section-label">Other verified reports</p><h3>其他有效报道</h3></div><span class="count" id="other-news-count">--</span></div>
          <ul class="other-news-list" id="other-news-list"></ul>
        </section>
      </section>
      <aside class="aside">
        <section class="aside-section"><p class="section-label">Sources</p><h3 class="aside-title">来源分布</h3><ul class="source-list" id="source-list"><li class="source-row"><span>等待数据</span><span>--</span></li></ul></section>
      </aside>
    </div>
  </main>
  <footer>联合报告入口 · 数据由 GitHub Actions 与阿里云函数分别更新</footer>
  <script>
    const state = { active: "personal", personal: null, media: null, errors: [], selectedCandidate: null };
    // The browser calls the OpenAI-compatible endpoint directly for manual summaries.
    const SUMMARY_API_BASE = "https://api.deepseek.com";
    const SUMMARY_API_KEY = "在这里粘贴浏览器摘要 API Key";
    const SUMMARY_MODEL = "deepseek-v4-flash";
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
    const copyText = async (value) => {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(value);
      const input = document.createElement("textarea"); input.value = value; input.style.position = "fixed"; input.style.opacity = "0"; document.body.appendChild(input); input.select(); document.execCommand("copy"); input.remove();
    };
    const itemText = (item) => item.copy_text || [item.summary || item.title || "", item.url || item.link || ""].filter(Boolean).join("\n");
    const normalizePersonal = (data) => ({ ...data, items: data.recommendations || data.items || [] });
    const normalizeMedia = (data) => ({ ...data, items: data.items || data.top10 || data.recommendations || [], featured: data.top10 || data.recommendations || data.items || [] });
    function currentData() { return state.active === "personal" ? state.personal : state.media; }
    function rssCandidates() { return state.media?.rss_candidates || []; }
    function renderMetrics(data) {
      const stats = data?.stats || {};
      const values = state.active === "personal" ? [[stats.new_neg ?? 0, "新增负面"], [stats.total_posts ?? 0, "监测帖子"], [stats.healthy ?? 0, "健康城市"], [stats.city_count ?? 0, "覆盖城市"]] : [[data?.items?.length ?? 0, "有效报道"], [stats.verified ?? 0, "原文核验"], [stats.rss_candidates ?? 0, "RSS候选"], [stats.summary_candidates ?? 0, "精选候选"]];
      $("#metrics").innerHTML = values.map(([value, label]) => {
        const isCandidateAction = state.active === "media" && label === "RSS候选";
        const tag = isCandidateAction ? "button" : "div";
        const extra = isCandidateAction ? " id=\"rss-candidate-card\" class=\"metric metric-action\" type=\"button\"" : " class=\"metric\"";
        return `<${tag}${extra}><span class="metric-value">${escapeHtml(value)}</span><span class="metric-label">${escapeHtml(label)}${isCandidateAction ? " · 点击查看" : ""}</span></${tag}>`;
      }).join("");
      const candidateCard = $("#rss-candidate-card");
      if (candidateCard) candidateCard.addEventListener("click", () => {
        $("#candidate-panel").hidden = !$("#candidate-panel").hidden;
        if (!$("#candidate-panel").hidden) renderCandidates();
      });
    }
    function renderSources(items) {
      const counts = items.reduce((map, item) => { const key = item.media || item.city || "其他"; map[key] = (map[key] || 0) + 1; return map; }, {});
      const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6);
      $("#source-list").innerHTML = rows.length ? rows.map(([name, count]) => `<li class="source-row"><strong>${escapeHtml(name)}</strong><span>${count} 条</span></li>`).join("") : `<li class="source-row"><span>暂无数据</span><span>--</span></li>`;
    }
    function renderCandidates() {
      const candidates = rssCandidates();
      $("#candidate-count").textContent = `共 ${candidates.length} 条`;
      $("#candidate-list").innerHTML = candidates.length ? candidates.map((item, index) => { const status = item.verified ? "已核验原文" : "待核验 RSS 跳转"; return `<div class="candidate-row"><span class="issue-number">${String(index + 1).padStart(2, "0")}</span><div><strong><a href="${escapeHtml(item.link || "#")}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title || "未命名候选")}</a></strong><div class="candidate-meta">${escapeHtml(item.media || "央媒")} · ${escapeHtml(item.time || "时间未知")} · ${status}</div></div><button class="select-candidate" type="button" data-candidate-index="${index}" data-selected="${String(state.selectedCandidate === item)}">选中</button></div>`; }).join("") : `<div class="empty">本轮没有 RSS 候选。</div>`;
      document.querySelectorAll(".select-candidate").forEach((button) => button.addEventListener("click", () => selectCandidate(Number(button.dataset.candidateIndex))));
    }
    function selectCandidate(index) {
      const candidate = rssCandidates()[index];
      if (!candidate) return;
      state.selectedCandidate = candidate;
      $("#candidate-detail").hidden = false;
      $("#selected-candidate-title").textContent = candidate.title || "未命名候选";
      $("#selected-candidate-meta").textContent = `${candidate.media || "央媒"} · ${candidate.time || "时间未知"}`;
      $("#generate-button").disabled = false;
      $("#draft-box").hidden = true;
      $("#draft-text").value = "";
      $("#draft-status").textContent = "";
      document.querySelectorAll(".select-candidate").forEach((button) => button.setAttribute("data-selected", String(Number(button.dataset.candidateIndex) === index)));
    }
    function cleanGeneratedSummary(text) {
      return String(text || "").replace(/^```(?:text|markdown)?/i, "").replace(/```$/g, "").replace(/^\s*\u25b3\s*/, "").trim();
    }
    async function tryReadCandidateArticle(item) {
      if (item.excerpt) return item.excerpt;
      if (!item.link) return "";
      try {
        const response = await fetch(item.link, { mode: "cors", cache: "no-store" });
        if (!response.ok) return "";
        const html = await response.text();
        const holder = document.createElement("div");
        holder.innerHTML = html;
        return (holder.textContent || "").replace(/\s+/g, " ").trim().slice(0, 12000);
      } catch (error) {
        return "";
      }
    }
    async function generateCandidateSummary() {
      const item = state.selectedCandidate;
      if (!item) return;
      const button = $("#generate-button");
      const status = $("#draft-status");
      if (!SUMMARY_API_KEY || SUMMARY_API_KEY.includes("在这里粘贴")) {
        status.textContent = "请先在 index.html 顶部填写 SUMMARY_API_KEY。";
        return;
      }
      button.disabled = true;
      button.textContent = "生成中…";
      status.textContent = "正在请求摘要接口，请稍候。";
      try {
        const articleText = await tryReadCandidateArticle(item);
        const prompt = `你是政务新闻编辑。请根据下面的央媒涉陕新闻信息写一段简洁、准确的两句摘要。只输出摘要正文，不加标题、来源括号、三角符号或链接；如果正文为空，就只能依据标题，不能编造标题之外的事实。\n媒体：${item.media || "央媒"}\n标题：${item.title || ""}\n原文链接：${item.link || ""}\n正文：${articleText || "（浏览器未能读取原文正文，请仅依据标题保持审慎）"}`;
        const response = await fetch(`${SUMMARY_API_BASE.replace(/\/$/, "")}/chat/completions`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUMMARY_API_KEY}` },
          body: JSON.stringify({ model: SUMMARY_MODEL, temperature: 0.1, max_tokens: 512, messages: [{ role: "user", content: prompt }] }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || `HTTP ${response.status}`);
        const summary = cleanGeneratedSummary(data.choices?.[0]?.message?.content);
        if (!summary) throw new Error("接口没有返回摘要");
        $("#draft-text").value = `${summary}\n${item.link || ""}`.trim();
        $("#draft-box").hidden = false;
        status.textContent = "摘要已生成，可以继续修改后按格式复制。";
      } catch (error) {
        status.textContent = `生成失败：${error.message || error}`;
      } finally {
        button.disabled = false;
        button.textContent = "生成摘要";
      }
    }
    function renderIssues() {
      const data = currentData();
      const items = state.active === "media" ? (data?.featured || data?.items || []) : (data?.items || []);
      const query = ($("#issue-search").value || "").trim().toLowerCase();
      const filter = document.querySelector(".filter[aria-pressed='true']")?.dataset.filter || "all";
      const visible = items.filter((item) => {
        const label = String(item.label || item.sentiment_label || "");
        const level = /负面|关注/.test(label) ? "negative" : /正面|正向/.test(label) ? "positive" : "all";
        const haystack = [item.city, item.media, item.title, item.summary, item.user, item.region].join(" ").toLowerCase();
        return (filter === "all" || level === filter) && (!query || haystack.includes(query));
      });
      $("#result-count").textContent = `共 ${visible.length} 条`;
      $("#issue-list").innerHTML = visible.length ? visible.map((item, index) => {
        const label = item.label || item.sentiment_label || "报道";
        const level = /负面|关注/.test(label) ? "negative" : /正面|正向/.test(label) ? "positive" : "all";
        const heading = state.active === "personal" ? `${item.city || "未知城市"} · ${item.user || "个人用户"}` : `${item.media || "央媒"} · ${item.title || "未命名报道"}`;
        const meta = state.active === "personal" ? `${item.region || item.city || ""} · ${item.time || ""}` : `${item.time || ""}`;
        const link = item.url || item.link || "";
        return `<article class="issue" data-level="${level}"><div class="issue-number">${String(index + 1).padStart(2, "0")}</div><div><div class="issue-top"><div class="issue-meta"><strong>${escapeHtml(heading)}</strong>${state.active === "personal" ? `<span class="tag ${level === "positive" ? "good" : ""}">${escapeHtml(label)}</span>` : ""}<br>${escapeHtml(meta)}</div><button class="copy-button" type="button" data-copy="${escapeHtml(itemText(item))}">复制</button></div><p class="issue-summary">${escapeHtml(item.summary || item.title || "暂无摘要")}</p>${link ? `<a class="issue-link" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>` : ""}</div></article>`;
      }).join("") : `<div class="empty">当前报告没有符合条件的内容。</div>`;
      document.querySelectorAll(".copy-button").forEach((button) => button.addEventListener("click", async () => {
        const original = button.textContent;
        try { await copyText(button.dataset.copy || ""); button.textContent = "已复制"; button.dataset.state = "copied"; } catch (error) { button.textContent = "失败"; }
        window.setTimeout(() => { button.textContent = original; delete button.dataset.state; }, 1500);
      }));
    }
    function renderOtherMedia() {
      const panel = $("#other-news");
      if (state.active !== "media" || !state.media) { panel.hidden = true; return; }
      const featuredLinks = new Set((state.media.featured || []).map((item) => item.link || item.title));
      const other = (state.media.items || []).filter((item) => !featuredLinks.has(item.link || item.title));
      panel.hidden = false;
      $("#other-news-count").textContent = `共 ${other.length} 条`;
      $("#other-news-list").innerHTML = other.length ? other.map((item) => `<li class="other-news-row"><a href="${escapeHtml(item.link || "#")}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title || "未命名报道")}</a><span>${escapeHtml(item.media || "央媒")} · ${escapeHtml(item.time || "时间未知")}</span></li>`).join("") : `<li class="empty">暂无其他有效报道。</li>`;
    }
    function render() {
      const data = currentData();
      const items = data?.items || [];
      $("#personal-count").textContent = state.personal ? String(state.personal.items.length).padStart(2, "0") : "--";
      $("#media-count").textContent = state.media ? String(state.media.items.length).padStart(2, "0") : "--";
      $("#section-label").textContent = state.active === "personal" ? "Personal / 01" : "Verified sources / 02";
      $("#panel-title").textContent = state.active === "personal" ? "精选舆情" : "精选报道";
      $("#updated-line").textContent = data ? `${data.period || "最新报告"} · 更新于 ${data.updated_at || "未知时间"}` : "正在读取最新日报";
      $("#status-line").textContent = state.errors.length ? "部分数据未更新" : (data ? "数据已同步" : "在线读取");
      renderMetrics(data); renderSources(items); renderIssues(); renderOtherMedia();
      if (state.active !== "media") { $("#candidate-panel").hidden = true; state.selectedCandidate = null; $("#candidate-detail").hidden = true; }
      else if (!$("#candidate-panel").hidden) renderCandidates();
    }
    document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => { state.active = tab.dataset.tab; document.querySelectorAll(".tab").forEach((button) => button.setAttribute("aria-selected", String(button === tab))); document.querySelectorAll(".filter").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.filter === "all"))); $("#issue-search").value = ""; state.selectedCandidate = null; render(); }));
    document.querySelectorAll(".filter").forEach((filter) => filter.addEventListener("click", () => { document.querySelectorAll(".filter").forEach((button) => button.setAttribute("aria-pressed", String(button === filter))); renderIssues(); }));
    $("#issue-search").addEventListener("input", renderIssues);
    $("#generate-button").addEventListener("click", generateCandidateSummary);
    $("#copy-draft").addEventListener("click", async () => {
      const draft = $("#draft-text").value.trim();
      if (!draft) return;
      try { await copyText(draft); $("#draft-status").textContent = "已按格式复制摘要和原文链接。"; } catch (error) { $("#draft-status").textContent = `复制失败：${error.message || error}`; }
    });
    async function load() {
      const requests = await Promise.allSettled([fetch(`personal.json?v=${Date.now()}`, { cache: "no-store" }).then((response) => { if (!response.ok) throw new Error("personal"); return response.json(); }), fetch(`media.json?v=${Date.now()}`, { cache: "no-store" }).then((response) => { if (!response.ok) throw new Error("media"); return response.json(); })]);
      state.errors = []; if (requests[0].status === "fulfilled") state.personal = normalizePersonal(requests[0].value); else state.errors.push("personal"); if (requests[1].status === "fulfilled") state.media = normalizeMedia(requests[1].value); else state.errors.push("media"); render();
    }
    render(); load();
  </script>
</body>
</html>
