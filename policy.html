<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>政策参考信息报送</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#20242a;background:#f4f6f8;--line:#dfe3e8;--muted:#66707c;--link:#1769aa}*{box-sizing:border-box}body{margin:0}header{background:#262b31;color:#fff;padding:24px 16px}header>div,main,footer{width:min(100% - 32px,900px);margin:auto}h1{margin:0;font-size:26px}header p{margin:8px 0 0;color:#d3d8df;font-size:13px}main{padding:20px 0 36px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.metric{text-align:center;padding:15px 8px}.metric+.metric{border-left:1px solid var(--line)}.value{display:block;font-size:24px;font-weight:700}.label{display:block;margin-top:5px;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar button{border:1px solid #aeb6c0;background:#fff;border-radius:6px;padding:8px 12px;cursor:pointer}.toolbar button.active{background:#262b31;color:#fff}.items{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-left:4px solid #1769aa;border-radius:6px;padding:15px 16px}.meta{color:var(--muted);font-size:12px;line-height:1.7}.summary{margin:10px 0;line-height:1.8;font-size:15px}.foot{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.foot a{color:var(--link);text-decoration:none}.empty{padding:18px;background:#fff;border:1px solid var(--line);border-radius:6px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:12px}@media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(3){border-left:0;border-top:1px solid var(--line)}.metric:nth-child(4){border-top:1px solid var(--line)}}</style></head>
<body><header><div><h1>政策参考信息报送</h1><p id="updated">正在加载 policy_reference.json...</p></div></header><main><section class="metrics"><div class="metric"><span class="value" id="total">-</span><span class="label">今日政策</span></div><div class="metric"><span class="value" id="yesterday">-</span><span class="label">昨日政策</span></div><div class="metric"><span class="value" id="ministries">-</span><span class="label">国家部委</span></div><div class="metric"><span class="value" id="provinces">-</span><span class="label">外省政策</span></div></section><div class="toolbar"><button class="active" data-filter="全部">全部</button><button data-filter="国家部委">国家部委</button><button data-filter="外省">外省</button><button data-filter="媒体地方版块">权威媒体</button></div><section id="items" class="items"></section></main><footer>来源白名单采集；主报仅展示当日和昨日政策。政策参考与个人舆情统计独立。</footer>
<script>
let data={items:[],stats:{}},filter="全部";function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const all=(data.items||[]).concat(data.historical_items||[]);const items=all.filter((i,n,a)=>a.findIndex(x=>x.url===i.url)===n).filter(i=>filter==='全部'||i.region===filter);document.querySelector('#items').innerHTML=items.length?items.map(i=>`<article class="item"><div class="meta">${esc(i.timeliness||'日期不明')} · ${esc(i.published_at||'日期不明')} · ${esc(i.region)} · ${esc(i.source_name)} · ${esc(i.topic)}${i.date_confidence==='unknown'?' · 日期待核':''}</div><div class="summary">${esc(i.summary)}</div><div class="foot"><span>${esc(i.source_type)} · 摘要：${esc(i.summary_source||'rule')}</span><a href="${esc(i.url)}" target="_blank" rel="noopener">官方原文 ↗</a></div></article>`).join(''):'<div class="empty">当前筛选条件没有政策条目。</div>'}fetch('policy_reference.json?t='+Date.now()).then(r=>r.json()).then(v=>{data=v;const s=v.stats||{};document.querySelector('#updated').textContent=`更新于 ${v.updated_at||'-'} · 状态 ${v.status||'-'}${v.historical_date?` · 历史数据日期 ${v.historical_date}`:''}`;document.querySelector('#total').textContent=s.today??0;document.querySelector('#yesterday').textContent=s.yesterday??0;document.querySelector('#ministries').textContent=s.ministries??0;document.querySelector('#provinces').textContent=s.provinces??0;render()}).catch(()=>{document.querySelector('#updated').textContent='政策参考数据暂时不可用';document.querySelector('#items').innerHTML='<div class="empty">政策参考采集异常，请查看个人日报中的运行状态。</div>'});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()}));
</script></body></html>
